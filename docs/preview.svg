<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17"/>
      <stop offset="50%" stop-color="#0f1424"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182035" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d1322" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="hotelImg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="hotelImg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="50%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="hotelImg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Ambient Luxury Glows -->
  <circle cx="200" cy="120" r="180" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1020" cy="380" r="220" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>

  <!-- Top Navbar -->
  <g transform="translate(40, 26)">
    <rect width="1120" height="64" rx="16" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    
    <!-- Brand Logo -->
    <rect x="18" y="14" width="36" height="36" rx="10" fill="url(#goldGrad)"/>
    <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#000" text-anchor="middle">👑</text>
    <text x="66" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff">LuxeStay</text>
    
    <rect x="165" y="20" width="165" height="24" rx="12" fill="#1f2937"/>
    <text x="247" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">By Umar Mukthar</text>
    
    <!-- Nav Items -->
    <g transform="translate(460, 22)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#9ca3af">
      <text x="0" y="16" fill="#f59e0b">Hotels</text>
      <text x="75" y="16">Destinations</text>
      <text x="185" y="16">Special Offers</text>
      <text x="300" y="16">My Bookings</text>
    </g>

    <!-- Creator Tag Button -->
    <rect x="945" y="16" width="155" height="32" rx="10" fill="url(#goldGrad)"/>
    <text x="1022" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#000" text-anchor="middle">@UMARMUKTHAR03</text>
  </g>

  <!-- Hero Reservation Bar -->
  <g transform="translate(40, 108)">
    <rect width="1120" height="105" rx="20" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5"/>
    
    <g transform="translate(30, 20)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <text x="0" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#f59e0b">LUXURY RESERVATION ENGINE</text>
      
      <!-- Input 1: Destination -->
      <g transform="translate(0, 28)">
        <text x="0" y="10" font-size="10" fill="#9ca3af">DESTINATION</text>
        <text x="0" y="30" font-size="16" font-weight="700" fill="#ffffff">Dubai, United Arab Emirates</text>
      </g>

      <!-- Input 2: Dates -->
      <g transform="translate(320, 28)">
        <text x="0" y="10" font-size="10" fill="#9ca3af">CHECK-IN / CHECK-OUT</text>
        <text x="0" y="30" font-size="16" font-weight="700" fill="#ffffff">Nov 15 - Nov 21, 2026 (6 Nights)</text>
      </g>

      <!-- Input 3: Guests -->
      <g transform="translate(640, 28)">
        <text x="0" y="10" font-size="10" fill="#9ca3af">ROOM &amp; GUESTS</text>
        <text x="0" y="30" font-size="16" font-weight="700" fill="#ffffff">2 Adults • 1 Presidential Suite</text>
      </g>

      <!-- Search CTA Button -->
      <g transform="translate(900, 24)">
        <rect width="160" height="42" rx="12" fill="url(#goldGrad)"/>
        <text x="80" y="26" font-size="13" font-weight="800" fill="#000" text-anchor="middle">🔍  Search Stays</text>
      </g>
    </g>
  </g>

  <!-- 3 Luxury Resort Cards -->
  <!-- Card 1 -->
  <g transform="translate(40, 235)">
    <rect width="350" height="340" rx="20" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5"/>
    <rect width="350" height="175" rx="20" fill="url(#hotelImg1)"/>
    <text x="25" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28">🏝️</text>
    <rect x="250" y="16" width="85" height="26" rx="8" fill="#000" fill-opacity="0.6"/>
    <text x="292" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">★ 4.95 (340)</text>

    <g transform="translate(25, 195)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <text x="0" y="16" font-size="16" font-weight="800" fill="#ffffff">Atlantis The Royal Resort</text>
      <text x="0" y="34" font-size="12" fill="#9ca3af">📍 Palm Jumeirah, Dubai</text>

      <g transform="translate(0, 52)" font-size="11" fill="#cbd5e1">
        <text x="0" y="10">Infinity Pool • Butler • Private Beach</text>
      </g>

      <line x1="0" y1="75" x2="300" y2="75" stroke="#1f2937" stroke-width="1"/>
      <text x="0" y="105" font-size="22" font-weight="900" fill="#fbbf24">$480 <tspan font-size="12" font-weight="400" fill="#9ca3af">/ night</tspan></text>
      <rect x="200" y="85" width="100" height="30" rx="8" fill="url(#goldGrad)"/>
      <text x="250" y="104" font-size="11" font-weight="800" fill="#000" text-anchor="middle">Book Suite</text>
    </g>
  </g>

  <!-- Card 2 -->
  <g transform="translate(425, 235)">
    <rect width="350" height="340" rx="20" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5"/>
    <rect width="350" height="175" rx="20" fill="url(#hotelImg2)"/>
    <text x="25" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28">🗼</text>
    <rect x="250" y="16" width="85" height="26" rx="8" fill="#000" fill-opacity="0.6"/>
    <text x="292" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">★ 4.98 (512)</text>

    <g transform="translate(25, 195)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <text x="0" y="16" font-size="16" font-weight="800" fill="#ffffff">Four Seasons Hotel George V</text>
      <text x="0" y="34" font-size="12" fill="#9ca3af">📍 Champs-Élysées, Paris</text>

      <g transform="translate(0, 52)" font-size="11" fill="#cbd5e1">
        <text x="0" y="10">Eiffel View • Michelin Star Dining</text>
      </g>

      <line x1="0" y1="75" x2="300" y2="75" stroke="#1f2937" stroke-width="1"/>
      <text x="0" y="105" font-size="22" font-weight="900" fill="#fbbf24">$620 <tspan font-size="12" font-weight="400" fill="#9ca3af">/ night</tspan></text>
      <rect x="200" y="85" width="100" height="30" rx="8" fill="url(#goldGrad)"/>
      <text x="250" y="104" font-size="11" font-weight="800" fill="#000" text-anchor="middle">Book Suite</text>
    </g>
  </g>

  <!-- Card 3 -->
  <g transform="translate(810, 235)">
    <rect width="350" height="340" rx="20" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5"/>
    <rect width="350" height="175" rx="20" fill="url(#hotelImg3)"/>
    <text x="25" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28">⛩️</text>
    <rect x="250" y="16" width="85" height="26" rx="8" fill="#000" fill-opacity="0.6"/>
    <text x="292" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">★ 4.92 (280)</text>

    <g transform="translate(25, 195)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <text x="0" y="16" font-size="16" font-weight="800" fill="#ffffff">Aman Tokyo Sanctuary</text>
      <text x="0" y="34" font-size="12" fill="#9ca3af">📍 Otemachi, Tokyo</text>

      <g transform="translate(0, 52)" font-size="11" fill="#cbd5e1">
        <text x="0" y="10">Mount Fuji View • Private Onsen</text>
      </g>

      <line x1="0" y1="75" x2="300" y2="75" stroke="#1f2937" stroke-width="1"/>
      <text x="0" y="105" font-size="22" font-weight="900" fill="#fbbf24">$550 <tspan font-size="12" font-weight="400" fill="#9ca3af">/ night</tspan></text>
      <rect x="200" y="85" width="100" height="30" rx="8" fill="url(#goldGrad)"/>
      <text x="250" y="104" font-size="11" font-weight="800" fill="#000" text-anchor="middle">Book Suite</text>
    </g>
  </g>

  <!-- Bottom Brand Footer -->
  <g transform="translate(40, 600)">
    <line x1="0" y1="0" x2="1120" y2="0" stroke="#1f2937" stroke-width="1.5"/>
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#9ca3af">
      LuxeStay Global Hotel &amp; Resort Reservation Engine • Engineered by <tspan fill="#fbbf24" font-weight="700">UMAR MUKTHAR</tspan>
    </text>
    <text x="1120" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f59e0b" text-anchor="end">
      https://github.com/UMARMUKTHAR03/hotel-reservation-system
    </text>
  </g>
</svg>
